schema_version: 1
constraints:
- constraint_id: C001
  description: 每周一、三、五要有3个菜（不包含汤）
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: 3
    max: 3
    weekdays:
    - 1
    - 3
    - 5
    type: matching_dish_count
    dish_types:
    - vegetarian
    - mixed
    - meat
    contains_categories: []
    contains_ingredient_ids: []
    as_main_ingredient: true
  parse_status: executable
  parse_notes: 周一、三、五：不含汤的菜恰好3个（min=max=3）。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C002
  description: 每周一、三、五晚饭要有一个汤
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: 1
    max: 1
    weekdays:
    - 1
    - 3
    - 5
    type: dish_type_count
    dish_type: soup
  parse_status: executable
  parse_notes: 周一、三、五各恰好一个汤；周二、四不限制。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C003
  description: 每顿饭的菜（不包括汤）里要有一个菜是绿叶菜作为食材
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: 1
    max: null
    weekdays: []
    type: matching_dish_count
    dish_types:
    - vegetarian
    - mixed
    - meat
    contains_categories:
    - leafy_green
    contains_ingredient_ids: []
    as_main_ingredient: true
  parse_status: executable
  parse_notes: 不含汤；绿叶菜须为主要食材；至少一道（理解为“至少一个”，未设上限）。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C004
  description: 每顿饭要有一个大荤菜，或两个荤素搭配菜
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    type: any_of
    alternatives:
    - min: 1
      max: null
      weekdays: []
      type: dish_type_count
      dish_type: meat
    - min: 2
      max: null
      weekdays: []
      type: dish_type_count
      dish_type: mixed
    weekdays: []
  parse_status: executable
  parse_notes: 每顿至少一个大荤菜，或至少两个荤素搭配菜；未设上限。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C005
  description: 每顿饭的食材不要重复（食材包括肉类和蔬菜，不包括调味菜）
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    type: no_shared_ingredients
    ignore_categories:
    - seasoning
    - aromatic
    only_categories: []
  parse_status: executable
  parse_notes: 同一顿饭内按食材ID比较，忽略调料和调味菜（aromatic）。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C006
  description: 每顿饭的菜品口味尽量不相似
  scope:
  - menu_generation
  - menu_adjustment
  strictness: soft
  source: persistent
  execution:
    type: dish_similarity
    max_similarity: null
    window_weeks: 1
    window_days: 1
    same_dinner: true
    feature: flavours
    skip_dish_types:
    - soup
  parse_status: executable
  parse_notes: 仅比较同一顿饭内的口味，汤不参与比较（按示例）；相似度阈值用默认值。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C007
  description: 相邻两天的菜品食材尽量不相似
  scope:
  - menu_generation
  - menu_adjustment
  strictness: soft
  source: persistent
  execution:
    type: dish_similarity
    max_similarity: null
    window_weeks: 1
    window_days: 2
    same_dinner: false
    feature: ingredients
    skip_dish_types: []
  parse_status: executable
  parse_notes: 比较相邻日历日的食材（不含调料和调味菜）；周五与下周一不算相邻；同一顿饭内不比较；汤也参与比较；阈值用默认值。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C008
  description: 每周菜品不重复
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    type: exact_repeat_window
    weeks: 1
  parse_status: executable
  parse_notes: 每周内同一道菜不重复（窗口1周）；不限制跨周重复。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C009
  description: 每周二、周四不能有汤
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: null
    max: 0
    weekdays:
    - 2
    - 4
    type: dish_type_count
    dish_type: soup
  parse_status: executable
  parse_notes: 周二、周四汤的数量最多0个；其他日子不限制。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C010
  description: 每顿饭最多一个汤
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: null
    max: 1
    weekdays: []
    type: dish_type_count
    dish_type: soup
  parse_status: executable
  parse_notes: 每顿饭汤最多1个，适用于所有工作日。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C011
  description: 每顿饭最多只有一个大荤菜
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: null
    max: 1
    weekdays: []
    type: dish_type_count
    dish_type: meat
  parse_status: executable
  parse_notes: 每顿饭大荤菜最多1道，适用于所有工作日。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C012
  description: 每顿饭大荤菜和荤素搭配菜加起来不能超过两道
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: null
    max: 2
    weekdays: []
    type: matching_dish_count
    dish_types:
    - meat
    - mixed
    contains_categories: []
    contains_ingredient_ids: []
    as_main_ingredient: true
  parse_status: executable
  parse_notes: 每顿饭大荤菜与荤素搭配菜合计最多2道，适用于所有工作日。
  overrides: []
  active: true
  created_at: null
  updated_at: null
- constraint_id: C013
  description: 每周二、周四要有4个菜（不包含汤）
  scope:
  - menu_generation
  - menu_adjustment
  strictness: hard
  source: persistent
  execution:
    min: 4
    max: 4
    weekdays:
    - 2
    - 4
    type: matching_dish_count
    dish_types:
    - vegetarian
    - mixed
    - meat
    contains_categories: []
    contains_ingredient_ids: []
    as_main_ingredient: true
  parse_status: executable
  parse_notes: 周二、周四：不含汤的菜恰好4个（min=max=4）。
  overrides: []
  active: true
  created_at: null
  updated_at: null
