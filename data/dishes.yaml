    note: 少许,出炉后刷表面
  servings: 3
  steps:
  - 三只鸡全腿洗净,用厨房纸擦干
  - 取半包盐焗鸡粉(约15g),内外均匀抹在鸡腿上
  - 加入少许花椒
  - 姜切片,葱切段,铺在鸡腿下面
  - 腌制30分钟以上
  - 每只鸡腿分别用锡纸包住
  - 烤箱预热至200℃
  - 将包好的鸡腿放入烤箱中层,烘烤约40分钟
  - 取出,打开锡纸,在鸡腿表面刷少许香油
  - 可再烤约5~10分钟,让表皮微微上色
