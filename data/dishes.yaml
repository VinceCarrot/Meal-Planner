    unmatched_name: null
    quantity: null
    unit: null
    note: 适量,约3g;焯水和调味用
  servings: 3
  steps:
  - 菜心洗净,沥干水分,较粗的茎对半剖开
  - 蒜切成蒜末
  - 炒锅烧热,倒入油,中小火下蒜末爆香,避免炒焦发苦
  - 转大火,下菜心快速翻炒
  - 加盐调味,翻炒均匀
  - 加入少许水 继续翻炒
  - 翻炒几下即可出锅
