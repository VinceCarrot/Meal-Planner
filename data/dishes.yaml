- dish_id: dish_0002
  name_zh: 番茄炒蛋
  name_en: Stir-fried Tomato and Eggs
  dish_type: mixed
  ingredients:
  - ingredient_id: ing_tomato
    unmatched_name: null
    quantity: 400.0
    unit: g
    note: null
  - ingredient_id: ing_egg
    unmatched_name: null
    quantity: 4.0
    unit: 个
    note: null
  - ingredient_id: ing_salt
    unmatched_name: null
    quantity: 3.0
    unit: g
    note: 蛋液约1g,调味约2g,可按口味增减
  - ingredient_id: ing_cooking_oil
    unmatched_name: null
    quantity: 30.0
    unit: ml
    note: 炒蛋约20ml,炒番茄约10ml
  servings: 3
  steps:
  - 番茄洗净,顶部划十字,用开水烫30秒后去皮,切成滚刀块
  - 鸡蛋打入碗中,加1g盐,搅打均匀
  - 锅烧热,倒入20ml油,中大火烧至油温较热
  - 倒入蛋液,炒至七八成熟的大块,盛出备用
  - 锅中补10ml油,中火放入番茄块翻炒
  - 炒至番茄出汁变软,约2-3分钟,加2g盐调味
  - 倒入炒好的鸡蛋,翻炒均匀,约30秒
  - 出锅装盘
  calories_kcal: null
  calorie_basis: null
  style:
    main_ingredients:
    - ing_tomato
    - ing_egg
    cooking_method: stir_fry
    flavours:
    - salty_savory
    - sweet_sour
    cuisine: 家常
  source: manual
