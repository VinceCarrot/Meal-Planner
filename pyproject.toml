[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner"
version = "0.1.0"
description = "Local-first family dinner planner"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",    # YAML data files
    "pydantic>=2.0",  # schema validation for YAML records and LLM output (ADR-002)
    "mcp>=2,<3",      # serves application tools to `claude -p` agent calls (ADR-005); 2.x API
    "uvicorn",        # runs the local MCP endpoint during an agent call
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["meal_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
